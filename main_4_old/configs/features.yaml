image_features:
  assume_input_pngs_are_analysis_images: true
  exact_gimp_white_balance_recovered: false
  approximation_note: >
    The thesis documents GIMP-based white balance and cropping, but exact raw-to-PNG
    preprocessing parameters are not fully recoverable from the inspected materials.
    This implementation therefore uses the provided PNGs directly and applies only
    deterministic feature extraction.
  physical_length_cm: 24.0
  strip_width_cm: main_first.0
  strip_step_cm: 0.5
  histogram_bins: 8
  high_rust_strip_threshold_pct: 5.0
  texture_downsample_step: 4
  glcm_distances: [main_first, 3]
  glcm_angles_rad: [0.0]
  rgb_thresholds:
    rust_lower: [25, 0, 0]
    rust_upper: [255, 100, 80]
    black_lower: [0, 0, 0]
    black_upper: [5, 5, 0]
    gray_lower: [60, 70, 35]
    gray_upper: [120, 105, 95]
