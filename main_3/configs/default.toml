[project]
seed = 42
test_size = 0.2
sample_length_cm = 24.0
max_rul_horizon_weeks = 104.0
future_step_weeks = 0.5
wire_loss_scale_to_percent_if_max_leq = 1.5
load_capacity_ratio_threshold = 0.8
health_index_threshold = 0.35
wire_loss_thresholds_pct = [20.0, 25.0, 30.0]

[paths]
data_dir = "../Data"
excel_path = "../Data/Images_Dataset_A-Z.xlsx"
image_dir = "../Data/Images_dataset"
outputs_dir = "outputs"
reports_dir = "reports"
figures_dir = "reports/figures"
logs_dir = "logs"
models_dir = "outputs/models"

[features]
longitudinal_segments = 12
crop_left_ratio = 0.03
crop_right_ratio = 0.03
crop_top_ratio = 0.08
crop_bottom_ratio = 0.08
diagnostic_preview_limit = 24

[targets]
corrosion_regression = [
  "surface_total_rust_pct",
  "peak_rust_pct",
]
corrosion_classification = [
  "surface_total_rust_category",
  "peak_rust_category",
]
damage_regression = [
  "wire_area_loss_pct",
  "ultimate_load_kn",
]
